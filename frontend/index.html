ört werden, während Drittstaaten möglicherweise Marktanteile in beiden Ländern gewinnen.", "historical_threads": [{"id": "us_canada_trade", "title": "US-kanadische Handelsbeziehungen", "entries": [{"date": "1988", "title": "Freihandelsabkommen USA-Kanada", "one_line": "Das erste umfassende Freihandelsabkommen zwischen beiden Ländern tritt in Kraft und beseitigt schrittweise Zölle und Handelshemmnisse.", "extended": "Das Canada-United States Free Trade Agreement legte den Grundstein für die heutige enge wirtschaftliche Verflechtung. Es war politisch umstritten, besonders in Kanada, wo Kritiker einen Verlust wirtschaftlicher Souveränität befürchteten. Das Abkommen führte zu einem massiven Anstieg des bilateralen Handels, schuf aber auch Abhängigkeiten, die in der aktuellen Krise sichtbar werden."}, {"date": "1994", "title": "NAFTA tritt in Kraft", "one_line": "Das Nordamerikanische Freihandelsabkommen erweitert die bilateralen Beziehungen um Mexiko und schafft einen gemeinsamen Wirtschaftsraum für 450 Millionen Menschen.", "extended": "NAFTA vertiefte die Integration erheblich und regelte nicht nur Zölle, sondern auch Investitionsschutz, geistiges Eigentum und Streitbeilegungsmechanismen. Über die Jahrzehnte entstand ein Netzwerk grenzüberschreitender Lieferketten, besonders in der Automobilindustrie, wo Teile mehrfach die Grenzen überqueren, bevor ein Fahrzeug fertiggestellt ist."}, {"date": "2018-03", "title": "Trump verhängt Stahl- und Aluminiumzölle", "one_line": "Während seiner ersten Amtszeit führt Trump Zölle auf kanadischen Stahl und Aluminium ein und begründet dies mit nationaler Sicherheit, was bei Verbündeten für Empörung sorgt.", "extended": "Die Zölle wurden mit Section 232 des Trade Expansion Act begründet, der Maßnahmen zum Schutz der nationalen Sicherheit erlaubt. Kanada reagierte mit Gegenzöllen auf US-Produkte wie Whiskey, Erdnussbutter und Spielkarten. Die Maßnahmen galten als Vorbote eines aggressiveren Handelskurses und belasteten die traditionell engen Beziehungen erheblich."}, {"date": "2020-07", "title": "USMCA ersetzt NAFTA", "one_line": "Das von Trump neu ausgehandelte Abkommen tritt in Kraft mit strengeren Regeln für Automobilproduktion und Arbeitnehmerrechte, wird aber als weitgehende Fortsetzung von NAFTA gesehen.", "extended": "Trump hatte NAFTA im Wahlkampf 2016 als schlechtesten Handelsdeal aller Zeiten bezeichnet. Das neue USMCA brachte einige Änderungen, etwa höhere Lohnanforderungen in der Autoproduktion und besseren Schutz für geistiges Eigentum, beließ aber den Kern der Freihandelszone intakt. Das Abkommen sollte für 16 Jahre gelten mit Überprüfungen alle sechs Jahre."}, {"date": "2025", "title": "Trump verweigert USMCA-Verlängerung", "one_line": "Nach Kanadas und Mexikos Antrag auf 16-jährige Verlängerung lehnt Trump ab und setzt damit ein Zeichen, dass selbst von ihm selbst ausgehandelte Abkommen nicht sakrosankt sind.", "extended": "Die Ablehnung signalisierte, dass Trump seine Handelspolitik nicht an langfristige Vereinbarungen binden lassen will. Sie schuf Unsicherheit für Unternehmen, die auf Planungssicherheit angewiesen sind, und untergrub das Vertrauen in die Verlässlichkeit amerikanischer Handelszusagen. Die aktuellen Zölle sind eine direkte Fortsetzung dieser Linie."}]}, {"id": "trump_tariff_policy", "title": "Trumps Zollpolitik als Instrument", "entries": [{"date": "2018-2019", "title": "Handelskrieg mit China", "one_line": "Trump verhängt Zölle auf chinesische Waren im Wert von Hunderten Milliarden Dollar und begründet dies mit unfairen Handelspraktiken und Technologiediebstahl.", "extended": "Der Handelskrieg mit China etablierte Zölle als Trumps bevorzugtes außenwirtschaftliches Druckmittel. Er argumentierte, Zölle würden amerikanische Arbeitsplätze schützen und China zu Konzessionen zwingen. Ökonomen wiesen nach, dass die Kosten größtenteils von amerikanischen Konsumenten und Unternehmen getragen wurden. Die Strategie setzte ein Muster, das Trump nun gegenüber Verbündeten wiederholt."}, {"date": "2019-05", "title": "Zolldrohung gegen Mexiko wegen Migration", "one_line": "Trump droht Mexiko mit steigenden Zöllen, wenn das Land nicht härter gegen Migration vorgeht, und zeigt damit, dass er Handelspolitik auch für nicht handelsbezogene Ziele einsetzt.", "extended": "Die angekündigten Zölle sollten bei 5 Prozent beginnen und monatlich steigen, bis Mexiko Maßnahmen gegen Migranten ergreift. Nach intensiven Verhandlungen wurde die Drohung zurückgezogen. Der Vorgang demonstrierte Trumps Bereitschaft, wirtschaftlichen Druck für politische Ziele einzusetzen, auch gegen Nachbarn und Partner im Rahmen von NAFTA."}, {"date": "2025-01", "title": "51. Bundesstaat-Rhetorik gegenüber Kanada", "one_line": "Nach seiner Rückkehr ins Amt wiederholt Trump die Aussage, Kanada solle der 51. US-Bundesstaat werden, was als wirtschaftliche Drohung und territoriale Provokation verstanden wird.", "extended": "Die Rhetorik kombiniert wirtschaftlichen Druck mit der Infragestellung kanadischer Souveränität. Sie wird in Kanada parteiübergreifend als beleidigend empfunden und stärkt paradoxerweise die nationale Einheit gegen amerikanischen Druck. Die Formulierung legt nahe, dass Trump Kanadas wirtschaftliche Abhängigkeit von den USA als Schwäche betrachtet, die ausgenutzt werden kann."}, {"date": "2025-09", "title": "Neue 50-Prozent-Zölle gegen Kanada", "one_line": "Nach gescheiterten Verhandlungen verhängt Trump massive Zölle auf kanadische Waren und löst damit einen offenen Handelskrieg mit einem der engsten Verbündeten aus.", "extended": "Die Zölle markieren eine beispiellose Eskalation gegenüber einem NATO-Partner und traditionellen Verbündeten. Sie demonstrieren, dass Trump bereit ist, selbst engste Beziehungen wirtschaftlichem Druck zu unterwerfen. Die Maßnahme erfolgt trotz der tiefen Integration beider Volkswirtschaften und könnte Lieferketten erheblich stören."}]}, {"id": "carney_political_rise", "title": "Mark Carneys politischer Aufstieg", "entries": [{"date": "2008-2013", "title": "Gouverneur der Bank of Canada", "one_line": "Carney führt Kanadas Zentralbank durch die Finanzkrise und wird international für seine Krisenmanagement-Fähigkeiten anerkannt.", "extended": "Unter Carneys Führung kam Kanada vergleichsweise glimpflich durch die globale Finanzkrise. Das kanadische Bankensystem erwies sich als stabiler als viele andere, was teilweise auf striktere Regulierung zurückgeführt wurde. Carneys Reputation als kompetenter Technokrat wurde in dieser Zeit begründet."}, {"date": "2013-2020", "title": "Gouverneur der Bank of England", "one_line": "Als erster Nicht-Brite in diesem Amt navigiert Carney die britische Zentralbank durch Brexit-Turbulenzen und etabliert sich als globale Finanzautorität.", "extended": "Carneys Amtszeit in London war von der Brexit-Abstimmung und deren Folgen geprägt. Er warnte vor den wirtschaftlichen Risiken des EU-Austritts und wurde dafür von Brexit-Befürwortern scharf kritisiert. Seine Erfahrung mit komplexen internationalen Wirtschaftsverhandlungen und seine Fähigkeit, unter Druck zu operieren, prägen nun seinen Umgang mit Trump."}, {"date": "2024", "title": "Wahlkampf als Anti-Trump-Kandidat", "one_line": "Carney kandidiert für das Amt des Premierministers mit dem Versprechen, Kanada gegen wirtschaftlichen Druck aus den USA zu verteidigen und gewinnt die Wahl.", "extended": "Carneys Wahlkampf fokussierte sich explizit auf die Notwendigkeit, gegen Trumps erwartete Rückkehr ins Weiße Haus gewappnet zu sein. Er positionierte sich als technokratischer Experte, der sowohl wirtschaftliche Kompetenz als auch internationale Verhandlungserfahrung mitbringt. Sein Sieg reflektierte kanadische Ängste vor amerikanischem Unilateralismus."}, {"date": "2025-09", "title": "Erste große Konfrontation mit Trump", "one_line": "Die gescheiterten Handelsgespräche und Carneys Ankündigung von Gegenzöllen sind der erste ernsthafte Test seiner Fähigkeit, sein Wahlversprechen einzulösen.", "extended": "Carneys Entscheidung, die Verhandlungen scheitern zu lassen und mit Dollar-für-Dollar-Vergeltung zu reagieren, ist riskant aber politisch notwendig. Er erhält parteiübergreifende Unterstützung, was seine Position stärkt. Die Krise wird zeigen, ob seine internationale Erfahrung ausreicht, um mit Trumps unkonventionellem Verhandlungsstil umzugehen."}]}], "entities": [{"name": "Donald Trump", "type": "person", "role_in_story": "Verhängt als US-Präsident 50-prozentige Zölle auf kanadische Waren und wirft Kanada vor, die Vorteile eines US-Bundesstaates ohne entsprechende Verpflichtungen zu wollen.", "profile": "Setzt Zölle systematisch als außenpolitisches Druckmittel ein, auch gegen traditionelle Verbündete, und verbindet wirtschaftliche Forderungen mit provokanter Rhetorik, die nationale Souveränität in Frage stellt. Bekannt für abrupte Kursänderungen und Bereitschaft, bestehende Vereinbarungen zu ignorieren oder neu zu verhandeln. Argumentiert, Zölle schützten amerikanische Arbeiter und Industrie, auch wenn Ökonomen auf Kostensteigerungen für Konsumenten hinweisen.", "established": "1946-06-14", "image_url": null}, {"name": "Mark Carney", "type": "person", "role_in_story": "Bezeichnet als kanadischer Premierminister die US-Zölle als Fehlkalkulation und Angriff, lässt Verhandlungen scheitern und kündigt Dollar-für-Dollar-Gegenzölle ab September an.", "profile": "Ehemaliger Gouverneur der Bank of Canada und Bank of England, positioniert sich als technokratischer Experte mit internationaler Verhandlungserfahrung. Gewann Wahl mit Versprechen, Kanada gegen Trump-Administration zu verteidigen. Zeigt Bereitschaft zur Konfrontation, wenn kanadische Interessen auf dem Spiel stehen, und sichert sich parteiübergreifende Unterstützung durch klare Positionierung gegen amerikanischen Druck.", "established": "1965-03-16", "image_url": null}, {"name": "USA", "type": "country", "role_in_story": "Verhängt 50-prozentige Zölle auf kanadische Waren im Wert von 20 Milliarden Dollar nach gescheiterten Handelsgesprächen.", "profile": "Größte Volkswirtschaft der Welt und wichtigster Handelspartner Kanadas. Unter Trump-Administration Rückkehr zu protektionistischer Handelspolitik und Bereitschaft, auch engste Verbündete wirtschaftlichem Druck auszusetzen. Nutzt Marktmacht als Verhandlungsinstrument und zeigt geringere Bindung an multilaterale Handelsabkommen.", "established": "1776-07-04", "image_url": null}, {"name": "Kanada", "type": "country", "role_in_story": "Sieht sich amerikanischen Strafzöllen ausgesetzt, lehnt US-Forderungen als unannehmbar ab und kündigt Vergeltungsmaßnahmen ab September an.", "profile": "Zehntgrößte Volkswirtschaft weltweit, stark exportorientiert mit etwa 75 Prozent der Exporte in die USA. Traditionell enge Beziehungen zum südlichen Nachbarn, geprägt von tiefer wirtschaftlicher Integration und gemeinsamen Sicherheitsinteressen. Steht vor Herausforderung, wirtschaftliche Abhängigkeit mit Wahrung nationaler Interessen zu balancieren.", "established": "1867-07-01", "image_url": null}, {"name": "USMCA", "type": "concept", "role_in_story": "Das nordamerikanische Handelsabkommen wird durch die Eskalation zwischen USA und Kanada in Frage gestellt, nachdem Trump bereits eine Verlängerung abgelehnt hatte.", "profile": "United States-Mexico-Canada Agreement, trat 2020 als Nachfolger von NAFTA in Kraft und regelt etwa 2 Billionen Dollar jährlichen Handel zwischen den drei Ländern. Von Trump selbst ausgehandelt, sollte ursprünglich Stabilität schaffen, wird aber durch seine Weigerung zur Verlängerung und aktuelle Zölle untergraben. Enthält Mechanismen zur Streitbeilegung, die in der aktuellen Krise jedoch umgangen werden.", "established": "2020-07-01", "image_url": null}, {"name": "Jamieson Greer", "type": "person", "role_in_story": "Als US-Handelsbeauftragter erklärt er, es gebe keine Pläne zur Wiederaufnahme der Gespräche, und begründet die Zölle mit jahrelangen kanadischen Vergeltungsmaßnahmen.", "profile": "Leitet als United States Trade Representative die Handelspolitik der Trump-Administration. Vertritt harte Linie in Handelsverhandlungen und argumentiert, Maßnahmen dienten dem Schutz amerikanischer Arbeiter und Lieferketten. Gibt Kanada die Schuld für gescheiterte Verhandlungen durch angebliche Rückzieher von vereinbarten Bedingungen.", "established": null, "image_url": null}], "quotes": [{"text": "Canada wants the benefits of being a State, without being one!!! They have also charged our great farmers, for many years, massive amounts of Tariffs. No more!!!", "attribution": "Donald Trump", "context": "US-Präsident, in seinem ersten öffentlichen Kommentar nach Scheitern der Verhandlungen", "source_url": "https://www.theguardian.com/world/2025/jan/19/trump-canada-trade-war"}, {"text": "You're at war when you're attacked, and we got attacked. We cannot accept what they've offered and we will not give what they've asked.", "attribution": "Mark Carney", "context": "Kanadischer Premierminister, bei Pressekonferenz in Ottawa", "source_url": "https://www.bbc.com/news/articles/cy8p7v98398o"}, {"text": "They asked too much and they offered too little.", "attribution": "Mark Carney", "context": "Kanadischer Premierminister, über das Scheitern der Verhandlungen", "source_url": "https://www.bbc.com/news/articles/cy8p7v98398o"}], "political_theory": {"theory": "[[Wirtschaftlicher Nationalismus]]", "points": ["[[Donald Trump]]s Zollpolitik folgt der Logik, dass nationale Interessen über internationale Handelsintegration gestellt werden müssen, auch wenn dies kurzfristig wirtschaftliche Kosten verursacht.", "Die Maßnahmen reflektieren die Überzeugung, dass Handelsdefizite und wirtschaftliche Interdependenz die nationale Souveränität und wirtschaftliche Sicherheit gefährden und durch protektionistische Politik korrigiert werden müssen.", "[[Mark Carney]]s Reaktion zeigt die Gegenreaktion: Wenn ein Land wirtschaftlichen Nationalismus aggressiv verfolgt, zwingt es Partner zu ähnlichen Maßnahmen, um eigene Interessen zu schützen, was zu Eskalationsspiralen führt.", "Die Infragestellung des [[USMCA]], eines von [[Trump]] selbst ausgehandelten Abkommens, illustriert ein Kernmerkmal wirtschaftsnationalistischer Politik: Multilaterale Vereinbarungen werden als Einschränkung nationaler Handlungsfreiheit betrachtet und sind jederzeit kündbar.", "Der Konflikt demonstriert den Widerspruch zwischen globalen Lieferketten, die auf Berechenbarkeit angewiesen sind, und einer Politik, die kurzfristige nationale Vorteile über langfristige Kooperationsgewinne stellt."]}, "connections": [{"source": "Donald Trump", "target": "USA", "relation": "Präsident, setzt protektionistische Handelspolitik um"}, {"source": "Mark Carney", "target": "Kanada", "relation": "Premierminister, verteidigt nationale Interessen gegen US-Druck"}, {"source": "Donald Trump", "target": "USMCA", "relation": "Verweigert Verlängerung des von ihm ausgehandelten Abkommens"}, {"source": "Jamieson Greer", "target": "USA", "relation": "US-Handelsbeauftragter, führt Verhandlungen"}, {"source": "USA", "target": "Kanada", "relation": "Verhängt 50-prozentige Strafzölle, löst Handelskrieg aus"}, {"source": "Kanada", "target": "USA", "relation": "Kündigt Dollar-für-Dollar-Gegenzölle an"}, {"source": "USMCA", "target": "USA", "relation": "Regelt Handelsbeziehungen, wird durch Zölle untergraben"}, {"source": "USMCA", "target": "Kanada", "relation": "Regelt Handelsbeziehungen, Zukunft ungewiss"}], "countries_covered": ["USA", "Kanada"], "image_url": null, "id": "dfd45e61", "sources": ["BBC News – World", "The Guardian – World", "The Hill"], "article_urls": ["https://www.bbc.co.uk/news/articles/cx272np7vgyo?at_medium=RSS&at_campaign=rss", "https://thehill.com/homenews/administration/6045531-trump-canada-tariffs-retaliation/", "https://www.theguardian.com/us-news/2026/aug/23/donald-trump-lashes-out-after-us-canada-talks-devolve-into-trade-war"], "primary_sources": [], "market_correlation": null, "_pipeline_meta": {"model": "claude-sonnet-4-5", "research_depth": "lite", "articles_used": 3, "input_tokens": 4667, "output_tokens": 6937}}, {"title": "USA verhängen 50%-Strafzölle auf kanadische Waren, Ottawa kündigt Vergeltung an", "theme_category": "trade", "one_line": "Die [[USA]] haben 50-prozentige Zölle auf etwa 20 Milliarden Dollar kanadischer Güter verhängt, worauf [[Mark Carney]] eine sofortige Gegenvergeltung ankündigte und die Verhandlungen abbrach.", "summary": ["Die [[USA]] verhängten ab 4. September 2025 Strafzölle von 50 Prozent auf etwa 20 Milliarden Dollar kanadischer Produkte, darunter Hockeyschläger, Holzspateln und weitere Güter. Die Maßnahme trat in Kraft, nachdem Handelsgespräche in letzter Minute scheiterten.", "[[Mark Carney]], der neue kanadische Premierminister, kündigte an, die amerikanischen Zölle ab 8. September \"Dollar für Dollar\" zu erwidern. Er beschuldigte die [[Trump-Regierung]], [[Kanada]] \"angegriffen\" zu haben und wirtschaftliche Integration als Waffe zu missbrauchen.", "Die Verhandlungen zerbrachen nach gegenseitigen Vorwürfen: [[Kanada]] berichtet von unfairen Last-Minute-Änderungen durch Washington, die Zollerleichterungen für kanadische Fahrzeuge reduzierten und die Souveränität einschränkten. Die [[USA]] warfen Ottawa vor, in letzter Minute zusätzliche Zugeständnisse gefordert zu haben.", "[[Jamieson Greer]], der amerikanische Handelsbeauftragte, begründete die Maßnahmen mit einem Jahr kanadischer Vergeltung und betonte, die [[USA]] hätten bereits großzügige Zollerleichterungen für Stahl, Autos und Holz angeboten. Weitere Gespräche sind nicht geplant."], "deep_dive": "Der Handelskonflikt markiert die schwerste Krise zwischen [[USA]] und [[Kanada]] seit Jahrzehnten und stellt die Beziehungen zweier der engsten Verbündeten auf eine harte Probe. Beide Länder sind durch das [[USMCA-Abkommen]] eng verflochten, das 2020 das nordamerikanische Freihandelsabkommen NAFTA ersetzte. Die aktuelle Eskalation zeigt, wie fragil selbst institutionalisierte Handelsbeziehungen unter unilateraler Machtpolitik werden können.\n\nExperten rechnen zunächst mit moderaten wirtschaftlichen Schäden, da die betroffenen 20 Milliarden Dollar nur einen Bruchteil des bilateralen Handelsvolumens von über 700 Milliarden Dollar jährlich ausmachen. Die größere Gefahr liegt im politischen Vertrauensverlust: Wenn ein Handelspartner Vereinbarungen in letzter Minute nachverhandelt oder einseitig aufkündigt, untergräbt das die Verlässlichkeit künftiger Abkommen. [[Carney]] machte deutlich, dass die amerikanischen Forderungen nach Einschränkungen kanadischer Handelsfreiheit mit Drittstaaten und nach Zugeständnissen bei Kultur und Sprache rote Linien überschritten.\n\nDie [[Trump-Regierung]] verfolgt systematisch eine Strategie der [[Wirtschaftlicher Nationalismus|wirtschaftsnationalistischen]] Neuverhandlung bestehender Handelsbeziehungen. Nach ähnlichen Konflikten mit China, der EU und Mexiko zeigt der Streit mit [[Kanada]], dass auch traditionelle Bündnispartner nicht von dieser Linie ausgenommen sind. Die Rhetorik, amerikanische Arbeitsplätze und Lieferketten zu schützen, dient dabei als innenpolitische Legitimation für Maßnahmen, die außenpolitisch als aggressiv wahrgenommen werden.\n\nFür [[Kanada]] kommt der Konflikt zu einem heiklen Zeitpunkt: [[Mark Carney]], erst seit kurzem im Amt, muss innenpolitisch Stärke demonstrieren, darf aber die wirtschaftliche Abhängigkeit von den [[USA]] nicht ignorieren. Seine scharfe Reaktion, [[Kanada]] befinde sich \"im Krieg\" mit dem südlichen Nachbarn, signalisiert, dass Ottawa nicht nachgeben wird. Die Frage ist, ob beide Seiten einen Weg zurück an den Verhandlungstisch finden, bevor die wirtschaftlichen Schäden irreversibel werden.", "cui_bono": "Innenpolitisch profitiert die [[Trump-Regierung]] von der Inszenierung als harte Verhandlungsführerin, die amerikanische Interessen gegen vermeintlich ungerechte Handelspartner verteidigt. [[Mark Carney]] wiederum kann sich als entschlossener Verteidiger kanadischer Souveränität positionieren und nutzt den Konflikt zur innenpolitischen Profilierung in seiner neuen Rolle. Strukturell könnten beide Seiten langfristig verlieren, wenn der Vertrauensverlust dauerhafte Risse in die nordamerikanische Wirtschaftsintegration treibt und Unternehmen beginnen, Lieferketten umzuleiten.", "historical_threads": [{"id": "us_kanada_handel", "title": "US-kanadische Handelsbeziehungen", "entries": [{"date": "1989", "title": "Freihandelsabkommen USA-Kanada", "one_line": "Das erste umfassende bilaterale Freihandelsabkommen zwischen beiden Ländern tritt in Kraft und schafft die Grundlage für die heutige tiefe wirtschaftliche Verflechtung.", "extended": "Das Abkommen eliminierte schrittweise die meisten Zölle und Handelshemmnisse zwischen den USA und Kanada. Es war damals umstritten, insbesondere in Kanada, wo Kritiker den Verlust wirtschaftlicher Souveränität befürchteten. Das Abkommen legte den Grundstein für die spätere Ausweitung auf Mexiko durch NAFTA."}, {"date": "1994", "title": "NAFTA-Inkrafttreten", "one_line": "Das nordamerikanische Freihandelsabkommen erweitert die Freihandelszone um Mexiko und schafft einen der größten Wirtschaftsräume der Welt.", "extended": "NAFTA vertiefte die Integration erheblich und führte zu komplexen grenzüberschreitenden Lieferketten, besonders in der Automobil- und Fertigungsindustrie. Das Abkommen wurde zum Symbol für Globalisierung, mit heftigen Debatten über Arbeitsplatzverlagerungen und Lohndruck in allen drei Ländern."}, {"date": "2018", "title": "Trump kündigt NAFTA-Neuverhandlung an", "one_line": "Präsident Trump bezeichnet NAFTA als schlechtestes Handelsabkommen der Geschichte und erzwingt Neuverhandlungen, die zu monatelangen Spannungen mit Kanada und Mexiko führen.", "extended": "Die Neuverhandlungen waren von Unsicherheit und gegenseitigen Drohungen geprägt. Trump verhängte zwischenzeitlich Strafzölle auf Stahl und Aluminium mit der Begründung der nationalen Sicherheit, was bei den Verbündeten Empörung auslöste. Die Episode zeigte bereits das transaktionale Verständnis von Handelsbeziehungen, das die Trump-Regierung prägt."}, {"date": "2020-07", "title": "USMCA tritt in Kraft", "one_line": "Das modernisierte Abkommen ersetzt NAFTA mit strengeren Ursprungsregeln für Autos und neuen Kapiteln zu digitaler Wirtschaft und Arbeitnehmerrechten.", "extended": "Das USMCA sollte die Handelsbeziehungen stabilisieren und enthielt Mechanismen zur Streitbeilegung. Es verlangte höhere nordamerikanische Inhaltsanteile in Fahrzeugen und bessere Löhne in mexikanischen Autofabriken. Die aktuelle Krise zeigt, dass auch formale Abkommen unter unilateralem Druck fragil bleiben."}, {"date": "2025-09", "title": "50%-Zölle und Verhandlungsabbruch", "one_line": "Nach gescheiterten Gesprächen verhängen die USA die höchsten Zölle auf kanadische Waren seit Generationen, Kanada kündigt sofortige Vergeltung an.", "extended": "Der Zusammenbruch der Verhandlungen trotz anfänglicher Fortschritte markiert einen Tiefpunkt. Die gegenseitigen Schuldzuweisungen und die Härte der Rhetorik unterscheiden diese Krise von früheren Handelskonflikten zwischen den Nachbarn und werfen die Frage auf, ob die institutionelle Infrastruktur der Handelsbeziehungen dauerhaft beschädigt wird."}]}, {"id": "trump_handelspolitik", "title": "Trumps Handelspolitik", "entries": [{"date": "2017", "title": "America First und Handelskrieg mit China", "one_line": "Trump startet systematische Neuausrichtung der US-Handelspolitik mit Fokus auf bilaterale Deals und Schutz amerikanischer Industrien, beginnend mit Zöllen auf chinesische Waren.", "extended": "Die Regierung begründete Zölle zunehmend mit nationaler Sicherheit statt nur mit unfairen Handelspraktiken, was den Handlungsspielraum erweiterte. Die Strategie zielte darauf, multilaterale Abkommen zu schwächen und durch bilaterale Verhandlungen zu ersetzen, in denen die USA ihre Marktmacht direkter ausspielen können."}, {"date": "2018-03", "title": "Stahl- und Aluminiumzölle gegen Verbündete", "one_line": "Die USA verhängen Zölle auf Stahl und Aluminium aus der EU, Kanada und Mexiko unter Berufung auf nationale Sicherheit, was bei Verbündeten Empörung auslöst.", "extended": "Die Nutzung des Sicherheitsarguments gegen enge Verbündete wurde als Missbrauch der Ausnahmeregelungen kritisiert. Kanada und die EU verhängten Gegenzölle auf symbolträchtige amerikanische Produkte wie Bourbon und Motorräder. Die Episode etablierte ein Muster konfrontativer Handelspolitik auch gegenüber Partnern."}, {"date": "2019-2020", "title": "Phase-One-Deal mit China", "one_line": "Nach zwei Jahren Handelskrieg einigen sich USA und China auf Teilabkommen, das chinesische Kaufzusagen gegen partielle Zollsenkungen tauscht.", "extended": "Das Abkommen zeigte die Grenzen einseitiger Zollpolitik: Viele Kaufzusagen wurden nie erfüllt, amerikanische Firmen und Konsumenten trugen die Kosten der Zölle. Dennoch interpretierte die Trump-Regierung den Deal als Erfolg ihrer harten Linie und Blueprint für künftige Verhandlungen."}, {"date": "2025", "title": "Zweite Amtszeit und verschärfte Rhetorik", "one_line": "In seiner zweiten Amtszeit intensiviert Trump die handelspolitische Konfrontation und wendet nun auch gegen traditionelle Verbündete wie Kanada maximale Drucktaktiken an.", "extended": "Die aktuelle Kanada-Krise zeigt, dass die Regierung die Methoden der China-Verhandlungen auch auf Verbündete anwendet: Last-Minute-Forderungen, öffentlicher Druck, hohe Zölle als Verhandlungsinstrument. Die Strategie setzt auf bilaterale Asymmetrie und riskiert bewusst den Bruch etablierter Beziehungen."}]}, {"id": "carney_aufstieg", "title": "Mark Carneys politische Wende", "entries": [{"date": "2008-2013", "title": "Gouverneur der Bank of Canada", "one_line": "Carney führt Kanada als Zentralbankchef durch die Finanzkrise mit einer Politik niedriger Zinsen und finanzpolitischer Vorsicht.", "extended": "Seine Amtszeit galt als erfolgreich, Kanada kam vergleichsweise glimpflich durch die Krise. Carney erwarb sich einen Ruf als technokratischer, unaufgeregter Krisenmanager mit internationaler Glaubwürdigkeit."}, {"date": "2013-2020", "title": "Gouverneur der Bank of England", "one_line": "Als erster Ausländer in diesem Amt navigiert Carney die britische Zentralbank durch Brexit und wirtschaftliche Unsicherheit.", "extended": "Die Ernennung war ungewöhnlich und zeugte von Carneys internationalem Ansehen. Er warnte wiederholt vor den wirtschaftlichen Risiken des Brexit, was ihm politische Kritik einbrachte, stärkte aber sein Profil als unabhängige Stimme. Seine Amtszeit endete mitten in den Brexit-Wirren."}, {"date": "2024", "title": "Eintritt in kanadische Politik", "one_line": "Nach Jahren der Spekulation wechselt der ehemalige Zentralbanker in die aktive Politik und wird Vorsitzender der Liberalen Partei Kanadas.", "extended": "Der Wechsel von der technokratischen zur politischen Rolle war riskant, aber Carney profitierte von seinem Image als kompetenter Krisenmanager. Seine internationale Erfahrung wurde als Aktivposten in einer Zeit globaler Unsicherheit gesehen."}, {"date": "2025", "title": "Premierminister in Krisenzeit", "one_line": "Carney übernimmt das Amt des Premierministers und steht unmittelbar vor der größten Handelskrise mit den USA seit Generationen.", "extended": "Die konfrontative Haltung gegenüber Washington ist eine Bewährungsprobe für den politischen Neuling. Seine scharfe Rhetorik vom Kriegszustand signalisiert, dass er gewillt ist, die technokratische Zurückhaltung seiner Zentralbankzeit abzulegen und als entschlossener politischer Führer aufzutreten."}]}], "entities": [{"name": "USA", "type": "country", "role_in_story": "Verhängen 50-prozentige Strafzölle auf etwa 20 Milliarden Dollar kanadischer Güter nach gescheiterten Verhandlungen.", "profile": "Verfolgen unter der Trump-Regierung eine konfrontative Handelspolitik, die auch traditionelle Verbündete als Verhandlungspartner behandelt, bei denen maximaler Druck ausgeübt wird. Die Strategie setzt auf bilaterale Asymmetrie und nutzt den großen amerikanischen Binnenmarkt als Hebel.", "established": "1776", "image_url": null}, {"name": "Kanada", "type": "country", "role_in_story": "Bricht Handelsgespräche mit den USA ab und kündigt Dollar-für-Dollar-Vergeltungszölle gegen amerikanische Strafmaßnahmen an.", "profile": "Hochgradig von den USA wirtschaftlich abhängig, exportiert etwa 75 Prozent seiner Waren dorthin. Muss innenpolitische Erwartungen an souveränes Auftreten mit der Realität asymmetrischer Wirtschaftsbeziehungen ausbalancieren und setzt in Konflikten auf symbolische Härte bei gleichzeitiger Bereitschaft zu Verhandlungen.", "established": "1867", "image_url": null}, {"name": "Mark Carney", "type": "person", "role_in_story": "Als kanadischer Premierminister bricht er die Verhandlungen ab, wirft Washington unfaire Last-Minute-Forderungen vor und verspricht sofortige Vergeltung.", "profile": "Ehemaliger Gouverneur der Zentralbanken Kanadas und Großbritanniens, wechselte 2024 in die Politik. Gilt als technokratischer Krisenmanager mit internationaler Erfahrung, muss nun beweisen, dass er auch politische Härte zeigen kann. Seine scharfe Rhetorik im Handelskonflikt markiert eine Abkehr von seiner früheren Zurückhaltung.", "established": "1965", "image_url": null}, {"name": "Trump-Regierung", "type": "organization", "role_in_story": "Verhängt die Strafzölle und wirft Kanada vor, Verhandlungen durch Last-Minute-Forderungen torpediert zu haben.", "profile": "Verfolgt systematisch eine Handelspolitik des wirtschaftlichen Nationalismus, die multilaterale Abkommen schwächen und durch bilaterale Deals ersetzen will. Nutzt Zölle als Druckmittel auch gegen Verbündete und setzt auf transaktionale Beziehungen statt langfristiger institutioneller Bindungen. Innenpolitisch zielt die Strategie auf Mobilisierung der Basis durch Konfrontation.", "established": "2025-01", "image_url": null}, {"name": "Jamieson Greer", "type": "person", "role_in_story": "Als US-Handelsbeauftragter verteidigt er die Strafzölle, wirft Kanada Unzuverlässigkeit vor und betont, Amerika habe großzügige Angebote gemacht.", "profile": "Handelsbeauftragter der Trump-Regierung, vertritt eine konfrontative Linie gegenüber Handelspartnern. Argumentiert mit dem Schutz amerikanischer Arbeitsplätze und Lieferketten, setzt dabei auf bilaterale Verhandlungsmacht statt multilaterale Kompromisse.", "established": null, "image_url": null}, {"name": "USMCA-Abkommen", "type": "concept", "role_in_story": "Das geltende Handelsabkommen zwischen USA, Kanada und Mexiko bildet den formalen Rahmen, innerhalb dessen die aktuelle Zollkrise eskaliert.", "profile": "Das 2020 in Kraft getretene United States-Mexico-Canada Agreement ersetzte NAFTA und sollte die nordamerikanische Handelsbeziehung modernisieren und stabilisieren. Es enthält strengere Ursprungsregeln für Fahrzeuge, Kapitel zu digitaler Wirtschaft und Arbeitnehmerrechten sowie Mechanismen zur Streitbeilegung. Die aktuelle Krise zeigt, dass auch formale Abkommen unter unilateralem politischem Druck fragil bleiben.", "established": "2020-07-01", "image_url": null}, {"name": "Wirtschaftlicher Nationalismus", "type": "concept", "role_in_story": "Die ideologische Grundlage der amerikanischen Handelspolitik, die die Strafzölle legitimiert.", "profile": "Politische Doktrin, die nationale Wirtschaftsinteressen über internationale Integration stellt und Handelsbeziehungen primär als Nullsummenspiel betrachtet. Bevorzugt bilaterale Verhandlungen, in denen größere Volkswirtschaften ihre Marktmacht direkt ausspielen können, gegenüber multilateralen Regeln. Nutzt Zölle und Handelsbeschränkungen als Instrumente zur Durchsetzung innenpolitischer Ziele wie Arbeitsplatzschutz in bestimmten Industrien.", "established": null, "image_url": null}], "quotes": [{"text": "They asked too much and offered too little.", "attribution": "Mark Carney", "context": "Kanadischer Premierminister zu den gescheiterten Verhandlungen", "source_url": "https://       early:   ["Already up? Here's what happened overnight.", "Coffee poured? Good, let's get into it.", "The day is young, the news cycle isn't.", "Early bird, early context.", "The sun's barely up. World politics has been awake for hours.", "Quiet in here, loud out there — a quick overview.", "Before the day catches up with you: the main threads, briefly.", "First coffee, first read on the day."],

  function greetingBucket(hour) {
    if (hour >= 23 || hour < 5) return "night";
    if (hour < 8) return "early";
    if (hour < 11) return "morning";
    if (hour < 14) return "noon";
    if (hour < 17) return "after";
    if (hour < 20) return "evening";
    return "late";
  }
  function pickGreeting() {
    var now = new Date();
    var bucket = greetingBucket(now.getHours());
    var pool = GREETINGS[state.lang][bucket];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  /* ---------------- rendering: home ---------------- */

  /* Tippt `text` Zeichen für Zeichen in `el`, mit blinkendem Cursor, ruft
     `onDone` nach dem letzten Zeichen auf. Geschwindigkeit skaliert leicht
     mit der Textlänge, damit auch lange Sprüche nicht ewig brauchen. */
  function typewriteText(el, text, onDone) {
    el.textContent = "";
    var cursor = document.createElement("span");
    cursor.className = "type-cursor";
    el.appendChild(cursor);
    var speed = Math.max(14, Math.min(32, 1100 / Math.max(1, text.length)));
    var i = 0;
    function step() {
      if (i < text.length) {
        cursor.insertAdjacentText("beforebegin", text.charAt(i));
        i++;
        setTimeout(step, speed);
      } else {
        cursor.remove();
        if (onDone) onDone();
      }
    }
    step();
  }

  /* Rubriken-Filterzeile auf der Startseite (Nutzer-Feedback 27.08.2026:
     "wenn man auf die Rubriken klickt, sollen die Nachrichten dieser
     Rubrik nicht ausgeblendet werden, sondern hervorgehoben werden! wenn
     ich auf Sicherheit klicke, sollen nur noch Sicherheitsnachrichten
     angezeigt werden"). Vorher: ein Klick auf eine noch aktive Rubrik
     ENTFERNTE genau diese aus der Auswahl -- ein Klick auf "Sicherheit"
     blendete Sicherheit also aus, das Gegenteil von "nur noch
     Sicherheitsnachrichten". Jetzt: exklusive Auswahl -- ein Klick auf
     eine Rubrik zeigt NUR NOCH diese (der Chip selbst wird hervorgehoben,
     nicht ausgeblendet), ein zweiter Klick auf denselben Chip oder auf
     "Alle Themen" setzt wieder auf alle zurueck. Das separate
     Mehrfachauswahl-Menü im Profil (data-catcheck, Inhaltspräferenzen)
     bleibt unveraendert fuer alle, die mehrere Rubriken kombinieren wollen. */
  function renderPrefRow() {
    var el = document.getElementById("prefRow");
    var allKeys = Object.keys(CATEGORIES);
    var allActive = state.activeCats.size === allKeys.length;
    var html = '<button class="pref-chip all' + (allActive ? " active" : "") + '" data-cat="__all__" style="' +
      (allActive ? "background:var(--accent);color:#141210" : "") + '">' + escapeHtml(t("allTopics")) + "</button>";
    allKeys.forEach(function (key) {
      var active = !allActive && state.activeCats.has(key);
      // 55/45-Abdunklung wie bei .cat-chip: die Kategorie-Töne sind
      // kräftiger als der Rest der Palette, ohne das wäre weißer Text auf
      // aktiven Chips kaum lesbar.
      html += '<button class="pref-chip' + (active ? " active" : "") + '" data-cat="' + key + '" style="' +
        (active ? "background:color-mix(in srgb, var(--cat-" + key + ") 55%, #000 45%)" : "") + '">' +
        catIcon(key) + escapeHtml(catLabel(key)) + "</button>";
    });
    el.innerHTML = html;
    el.querySelectorAll(".pref-chip").forEach(function (btn) {
      btn.onclick = function () {
        var key = btn.getAttribute("data-cat");
        if (key === "__all__") {
          state.activeCats = new Set(allKeys);
        } else if (state.activeCats.size === 1 && state.activeCats.has(key)) {
          // Erneuter Klick auf die schon exklusiv aktive Rubrik: zurueck zu "alle".
          state.activeCats = new Set(allKeys);
        } else {
          state.activeCats = new Set([key]);
        }
        renderHome();
      };
    });
  }

  /* `onDone` läuft NACH der Tipp-Animation (nur beim allerersten Aufruf --
     bei jedem weiteren Aufruf ist der Text schon getippt, `onDone` feuert
     dann sofort synchron). So kann `renderHome()` Filterzeile/Grid erst
     NACH dem Tippen einblenden lassen, ohne bei jedem Kategorie-Klick neu
     zu tippen oder zu warten. */
  function storyCounts() {
    return STORIES.filter(function (s) { return state.activeCats.has(s.theme_category); }).length;
  }

  function renderGreeting(onDone) {
    document.getElementById("greetEyebrow").textContent = new Date().toLocaleDateString(
      state.lang === "de" ? "de-DE" : "en-US", { weekday: "long", day: "numeric", month: "long" }
    );
    var n = storyCounts();
    document.getElementById("greetSub").textContent = state.lang === "de"
      ? n + " Storys aufbereitet, mit Historie, Akteuren und ehrlicher Markteinordnung."
      : n + " stories broken down, with history, stakeholders and honest market context.";
    if (!state.greetingText) state.greetingText = pickGreeting();
    var el = document.getElementById("greetTitle");
    if (!state.greetingTyped) {
      state.greetingTyped = true;
      typewriteText(el, state.greetingText, onDone);
    } else {
      el.textContent = state.greetingText;
      if (onDone) onDone();
    }
  }

  function cardHtml(story, idx, animate) {
    var img = mediaTag(story.image_url, { iconType: "event", catKey: story.theme_category, cls: "card-media", alt: story.title });
    var isSaved = state.saved.has(story.id);
    var nSources = (story.article_urls || story.sources || []).length;
    var cls = "card" + (animate ? " fade-in" : "");
    var style = "--cat-color: var(--cat-" + story.theme_category + ")" +
      (animate ? "; animation-delay:" + Math.min((idx || 0) * 45, 420) + "ms" : "");
    return '<div class="' + cls + '" data-id="' + story.id + '" style="' + style + '">' +
      '<div style="position:relative">' + img +
        '<span class="cat-chip">' + catIcon(story.theme_category) + escapeHtml(catLabel(story.theme_category)) + '</span>' +
        '<button class="save-btn' + (isSaved ? " saved" : "") + '" data-save="' + story.id + '">' + (isSaved ? BOOKMARK_IN : BOOKMARK_OUT) + '</button>' +
      '</div>' +
      '<div class="card-body">' +
        '<h3 class="card-title">' + escapeHtml(story.title) + '</h3>' +
        '<p class="card-dek">' + escapeHtml(stripLinks(story.one_line)) + '</p>' +
        '<div class="card-meta"><span>' + t("sources")(nSources) + '</span></div>' +
      '</div></div>';
  }
  function stripLinks(text) { return (text || "").replace(/\[\[([^\]]+)\]\]/g, "$1"); }

  function renderStoryGridBody(animate) {
    var grid = document.getElementById("storyGrid");
    var visible = STORIES.filter(function (s) { return state.activeCats.has(s.theme_category); });
    if (!visible.length) {
      grid.innerHTML = '<div class="empty-state">' + t("noStories") + "</div>";
    } else {
      grid.innerHTML = visible.map(function (s, i) { return cardHtml(s, i, animate); }).join("");
    }
    grid.querySelectorAll(".card").forEach(function (card) {
      card.addEventListener("click", function (e) {
        if (e.target.closest("[data-save]")) return;
        openDetail(card.getAttribute("data-id"));
      });
    });
    grid.querySelectorAll("[data-save]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleSave(btn.getAttribute("data-save"));
      });
    });
  }

  function renderHome() {
    document.getElementById("brandLabel").textContent = t("brand");
    renderGreeting(function () {
      // Filterzeile + Grid bauen sich erst NACH dem Tipp-Effekt gestaffelt
      // auf (nur beim ersten Laden, s. `state.introGridPlayed`) -- danach
      // (z.B. bei Kategorie-Filter-Klicks) rendert alles sofort, ohne
      // erneute Animation.
      renderPrefRow();
      renderStoryGridBody(!state.introGridPlayed);
      state.introGridPlayed = true;
    });
  }

  function toggleSave(id) {
    if (state.saved.has(id)) state.saved.delete(id); else state.saved.add(id);
    if (state.view === "home") renderHome();
    if (state.view === "saved") renderSavedView();
    var overlayBtn = document.querySelector("#detailOverlay [data-save-detail]");
    if (overlayBtn) {
      var saved = state.saved.has(id);
      overlayBtn.classList.toggle("saved", saved);
      overlayBtn.innerHTML = (saved ? BOOKMARK_IN : BOOKMARK_OUT);
    }
  }

  /* ---------------- detail view ---------------- */
  function getStory(id) { return STORIES.find(function (s) { return s.id === id; }); }

  function openDetail(id) {
    var story = getStory(id);
    if (!story) return;
    if (state.history.indexOf(id) === -1) state.history.unshift(id); else { state.history.splice(state.history.indexOf(id),1); state.history.unshift(id); }
    state.currentStoryId = id;
    state.activeTab = 0;
    document.getElementById("detailOverlay").innerHTML = detailHtml(story);
    document.getElementById("detailOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
    wireDetail(story);
    document.getElementById("detailOverlay").scrollTop = 0;
  }
  function closeDetail() {
    document.getElementById("detailOverlay").classList.remove("open");
    document.body.style.overflow = "";
  }

  var DEFAULT_TAB = 1; /* Übersicht ist der Startpunkt: links Historien, rechts Stakeholders/Märkte */

  function detailHtml(story) {
    var cat = story.theme_category;
    var hero = mediaTag(story.image_url, { iconType: "event", catKey: cat, cls: "detail-hero", alt: story.title });
    var isSaved = state.saved.has(story.id);
    return '<div style="--cat-color: var(--cat-' + cat + ')">' +
      '<div class="overlay-topbar">' +
        '<button class="pill-btn" id="btnBack">' + BACK_ICON + t("back") + '</button>' +
        '<button class="icon-btn' + (isSaved ? " saved" : "") + '" data-save-detail>' + (isSaved ? BOOKMARK_IN : BOOKMARK_OUT) + '</button>' +
      '</div>' +
      '<div style="position:relative">' + hero + '</div>' +
      '<div class="detail-content">' +
        '<div class="detail-eyebrow"><span class="detail-cat-chip">' + catIcon(cat) + escapeHtml(catLabel(cat)) + '</span>' +
          '<span>' + t("sources")((story.article_urls||story.sources||[]).length) + '</span></div>' +
        '<h1 class="detail-title">' + escapeHtml(story.title) + '</h1>' +
        '<p class="detail-dek">' + linkify(story.one_line, story) + '</p>' +
        tabbarHtml() +
        '<div class="tab-viewport"><div class="tab-track" id="tabTrack">' +
          '<div class="tab-pane">' + threadsHtml(story) + '</div>' +
          '<div class="tab-pane">' + overviewHtml(story) + '</div>' +
          '<div class="tab-pane">' + stakeholdersHtml(story) + '</div>' +
          '<div class="tab-pane">' + marketHtml(story) + '</div>' +
          '<div class="tab-pane">' + theoryPaneHtml(story) + '</div>' +
        '</div></div>' +
        quotesAndSourcesHtml(story) +
      '</div>' +
    '</div>';
  }

  function tabbarHtml() {
    var tabs = [t("historien"), t("uebersicht"), t("stakeholdersTab"), t("maerkte"), t("theorieTab")];
    return '<div class="tabbar" id="detailTabbar">' + tabs.map(function (label, i) {
      return '<button class="tab-btn' + (i===DEFAULT_TAB?" active":"") + '" data-tab="' + i + '">' + escapeHtml(label) + "</button>";
    }).join("") + "</div>";
  }

  function overviewHtml(story) {
    return '<ul class="summary-list">' + (story.summary||[]).map(function(b){ return "<li><span class=\"li-text\">" + linkify(b, story) + "</span></li>"; }).join("") + '</ul>' +
      (story.deep_dive ? (
        '<div class="readmore-toggle"><button class="pill-btn" id="btnReadMore">' + t("readMore") + '</button></div>' +
        '<div class="readmore-box" id="readMoreBox"><div><div class="deep-dive">' + linkify(story.deep_dive, story) + '</div></div></div>'
      ) : '');
  }

  function threadsHtml(story) {
    var threads = story.historical_threads || [];
    if (!threads.length) return '<div class="market-empty">—</div>';
    var activeIdx = state.activeThread[story.id] || 0;
    var tabs = threads.map(function (th, i) {
      return '<button class="thread-tab' + (i===activeIdx?" active":"") + '" data-thread="' + i + '">' + escapeHtml(th.label || th.title || ("Linie " + (i+1))) + "</button>";
    }).join("");
    var entries = threads[activeIdx].entries || [];
    var timeline = '<div class="timeline">' + entries.map(function (en, i) {
      return '<div class="tl-item" data-tl="' + i + '"><span class="tl-dot"></span>' +
        (en.date || en.year ? '<div class="tl-year">' + escapeHtml(fmtTlDate(en.date || en.year)) + '</div>' : '') +
        '<div class="tl-one">' + escapeHtml(en.one_line || "") + (en.extended ? '<span class="tl-toggle-hint">+</span>' : '') + '</div>' +
        (en.extended ? '<div class="tl-ext">' + escapeHtml(en.extended) + '</div>' : '') +
      '</div>';
    }).join("") + '</div>';
    return (threads.length > 1 ? '<div class="thread-tabs">' + tabs + '</div>' : '') + timeline;
  }

  var CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var MINUS_ICON = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M8 12h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';

  /* Pro/Con-Karte je Akteur. `item.counter` (Nutzer-Feedback 27.08.2026:
     "diskutiere jeweils die Sinnhaftigkeit der Massnahmen eines
     Politikers, bringe immer Perspektive und Gegenperspektive ein") ist
     die Gegenperspektive zu `item.reason` -- neu vom Pipeline-Schema
     geliefert (s. synthesize_story.py), bei aelteren, vor diesem Update
     erzeugten Storys noch nicht vorhanden. Daher optional rendern statt
     die Karte kaputt zu machen, ganz im Stil des Projekts: leer lassen
     statt etwas zu erfinden. */
  function stakeCardHtml(item, side, story) {
    var ent = findEntity(story, item.entity);
    var img = mediaTag(ent && ent.image_url, { iconType: ent ? ent.type : "concept", catKey: story.theme_category, cls: "stake-avatar", alt: item.entity });
    return '<button class="stake-card ' + side + '" data-entity-open="' + escapeHtml(item.entity) + '">' + img +
      '<div class="stake-body"><div class="stake-name">' + escapeHtml(item.entity) + '</div>' +
      '<div class="stake-reason">' + escapeHtml(item.reason || "") + '</div>' +
      (item.counter ? '<div class="stake-counter"><span class="stake-counter-label">' + t("counterLabel") + '</span><span>' + escapeHtml(item.counter) + '</span></div>' : '') +
      '</div></button>';
  }

  function stakeholdersHtml(story) {
    var sh = story.stakeholders;
    if (!sh || (!(sh.pro||[]).length && !(sh.con||[]).length)) return '<div class="market-empty">—</div>';
    var pro = sh.pro || [], con = sh.con || [];
    var html = '<div class="stake-columns">' +
      '<div class="stake-section"><div class="stake-heading pro">' + CHECK_ICON + t("profitsFrom") + '</div>' +
      '<div class="stake-list">' + (pro.length ? pro.map(function (it) { return stakeCardHtml(it, "pro", story); }).join("") : '<div class="stake-empty">' + t("noProfiteers") + '</div>') + '</div></div>' +
      '<div class="stake-section"><div class="stake-heading con">' + MINUS_ICON + t("losesFrom") + '</div>' +
      '<div class="stake-list">' + (con.length ? con.map(function (it) { return stakeCardHtml(it, "con", story); }).join("") : '<div class="stake-empty">' + t("noLosers") + '</div>') + '</div></div>' +
      '</div>' +
      (sh.note ? '<div class="stake-note">' + escapeHtml(sh.note) + '</div>' : '');
    return html;
  }

  function entitiesHtml(story) {
    var ents = story.entities || [];
    if (!ents.length) return '<div class="market-empty">—</div>';
    return '<div class="entity-grid">' + ents.map(function (e) {
      var img = mediaTag(e.image_url, { iconType: e.type, catKey: story.theme_category, cls: "entity-avatar", alt: e.name });
      return '<div class="entity-chip" data-entity-open="' + escapeHtml(e.name) + '">' + img +
        '<div class="entity-name">' + escapeHtml(e.name) + '</div>' +
        '<div class="entity-role">' + escapeHtml(e.role_in_story || "") + '</div></div>';
    }).join("") + '</div>';
  }

  function marketHtml(story) {
    var mc = story.market_correlation;
    // Kein Feld oder das Modell hat ehrlich KEINEN Zusammenhang gefunden
    // (has_correlation=false) -- das ist ein vollwertiges Ergebnis, kein
    // Fehlerzustand, s. noMarket-Text.
    if (!mc || !mc.has_correlation) {
      return '<div class="market-empty">' + t("noMarket") + (mc && mc.explanation ? '<div style="margin-top:10px;font-size:13.5px;">' + escapeHtml(mc.explanation) + '</div>' : '') + '</div>';
    }
    // has_correlation=true, aber KEINE Kurve/Datenpunkte (Lite-Modus --
    // qualitative Einschaetzung aus Allgemeinwissen statt Live-Recherche,
    // s. synthesize_story.py::STORY_JSON_SCHEMA_HINT_MARKET_LITE). Vorher
    // landete das faelschlich im "keine Korrelation gefunden"-Zweig oben,
    // obwohl das Modell durchaus einen Zusammenhang sieht (Nutzer-Feedback
    // 24.08.2026: "keine korrelation bei einem riesigen handelsstreit mit
    // 50% Zoellen? I doubt it."). Eigener Zweig: Text prominent, klar als
    // Einschaetzung statt Live-Daten gekennzeichnet, kein Chart (den gibt's
    // erst mit echten Kurszahlen aus research_depth="full").
    if (!mc.series || !mc.series.length) {
      return '<div class="chart-card">' +
        (mc.explanation ? '<div class="chart-sub">' + escapeHtml(mc.explanation) + '</div>' : '') +
        '<div class="market-note-badge">' + t("marketQualitative") + '</div>' +
        (mc.note ? '<div class="chart-note">' + escapeHtml(mc.note) + '</div>' : '') +
      '</div>';
    }
    var legend = mc.series.length > 1 ? '<div class="legend-row">' + mc.series.map(function (s, i) {
      return '<div class="legend-item"><span class="legend-swatch" style="background:' + (i === 0 ? "var(--cat-color)" : "var(--ink-muted)") + '"></span>' + escapeHtml(s.label) + '</div>';
    }).join("") + '</div>' : '';
    return '<div class="chart-card">' +
      (mc.explanation ? '<div class="chart-sub">' + escapeHtml(mc.explanation) + '</div>' : '') +
      legend +
      '<div style="position:relative"><svg id="mcChart" viewBox="0 0 640 240" width="100%" height="240" style="overflow:visible"></svg>' +
      '<div class="tooltip" id="mcTooltip"></div></div>' +
      (mc.note ? '<div class="chart-note">' + escapeHtml(mc.note) + '</div>' : '') +
    '</div>';
  }

  var BIAS_CLASS = { left: "bias-left", "center-left": "bias-center-left", center: "bias-center", "center-right": "bias-center-right", right: "bias-right" };

  var DOMAIN_LABELS = {
    "npr.org": "NPR", "aljazeera.com": "Al Jazeera", "cbsnews.com": "CBS News",
    "reuters.com": "Reuters", "apnews.com": "AP News", "bbc.co.uk": "BBC", "bbci.co.uk": "BBC",
    "nbcnews.com": "NBC News", "foxnews.com": "Fox News", "cnn.com": "CNN",
    "washingtonpost.com": "Washington Post", "nytimes.com": "NYT", "wsj.com": "WSJ",
    "theguardian.com": "The Guardian", "politico.com": "Politico", "axios.com": "Axios",
    "thehill.com": "The Hill", "dw.com": "DW", "france24.com": "France24",
    "themoscowtimes.com": "Moscow Times", "irishtimes.com": "Irish Times",
    "timesofisrael.com": "Times of Israel", "csis.org": "CSIS",
    "defensenews.com": "Defense News", "aei.org": "AEI", "usnews.com": "US News",
    "fortune.com": "Fortune", "pbs.org": "PBS", "senate.gov": "US-Senat",
    "congress.gov": "Congress.gov", "state.gov": "US State Dept.",
    "whitehouse.gov": "White House", "hrw.org": "Human Rights Watch"
  };
  function hostLabel(url) {
    try {
      var h = new URL(url).hostname.replace(/^www\./, "");
      for (var domain in DOMAIN_LABELS) { if (h === domain || h.indexOf("." + domain) === h.length - domain.length - 1) return DOMAIN_LABELS[domain]; }
      var base = h.split(".").slice(0, -1).join(".") || h;
      base = base.split(".")[0];
      return base.charAt(0).toUpperCase() + base.slice(1);
    } catch (e) { return "Quelle"; }
  }
  function biasForLabel(label) {
    var keys = Object.keys(SOURCE_BIAS);
    for (var i = 0; i < keys.length; i++) {
      if (keys[i].toLowerCase().indexOf(label.toLowerCase()) === 0) return SOURCE_BIAS[keys[i]];
    }
    return null;
  }

  function quotesAndSourcesHtml(story) {
    var quotes = story.quotes || [];
    var urls = story.article_urls || [];
    var primary = story.primary_sources || [];
    var html = "";
    if (quotes.length) {
      html += '<h2 class="section-heading">' + t("quotes") + '</h2>';
      quotes.forEach(function (q) {
        html += '<div class="quote-card"><p class="quote-text">“' + escapeHtml(q.text) + '”</p><div class="quote-attr">' + escapeHtml(q.attribution || "") + (q.context ? " · " + escapeHtml(q.context) : "") + '</div></div>';
      });
    }
    if (urls.length) {
      html += '<h2 class="section-heading">' + t("sourcesHead") + '</h2><div class="source-row">';
      urls.forEach(function (url) {
        var label = hostLabel(url);
        var bias = biasForLabel(label);
        var biasCls = BIAS_CLASS[bias] || "bias-unknown";
        html += '<button class="source-btn" data-open="' + escapeHtml(url || "") + '"><span class="bias-dot ' + biasCls + '"></span>' + escapeHtml(label) + EXTERNAL + '</button>';
      });
      html += '</div>';
    }
    if (primary.length) {
      html += '<h2 class="section-heading">' + t("primarySources") + '</h2>';
      primary.forEach(function (p) {
        html += '<div class="primary-source-card"><div class="primary-source-title">' + escapeHtml(p.title || "") + '</div>' +
          (p.note ? '<div class="primary-source-desc">' + escapeHtml(p.note) + '</div>' : '') +
          '<button class="source-btn" data-open="' + escapeHtml(p.url || "") + '">' + escapeHtml(p.issuer || "Dokument öffnen") + EXTERNAL + '</button></div>';
      });
    }
    return html;
  }

  function theoryPaneHtml(story) {
    var theory = story.political_theory;
    if (!theory || !theory.theory) return '<div class="market-empty">' + t("noTheory") + '</div>';
    var points = theory.points || [];
    var lead = points.length ? points[0] : "";
    var rest = points.slice(1);
    return '<div class="theory-concept">' + linkify(theory.theory, story) + '</div>' +
      (lead ? '<p class="theory-lead">' + linkify(lead, story) + '</p>' : '') +
      (rest.length ? (
        '<div class="readmore-toggle"><button class="pill-btn" id="btnTheoryMore">' + t("readMore") + '</button></div>' +
        '<div class="readmore-box" id="theoryReadMoreBox"><div><ul class="theory-points">' +
          rest.map(function (p) { return "<li>" + linkify(p, story) + "</li>"; }).join("") +
        '</ul></div></div>'
      ) : '');
  }

  function wireDetail(story) {
    document.getElementById("btnBack").onclick = closeDetail;
    var saveBtn = document.querySelector("[data-save-detail]");
    if (saveBtn) saveBtn.onclick = function () { toggleSave(story.id); };

    document.querySelectorAll("#detailTabbar .tab-btn").forEach(function (btn) {
      btn.onclick = function () { setActiveTab(parseInt(btn.getAttribute("data-tab"), 10)); };
    });
    setActiveTab(DEFAULT_TAB, true);

    wireThreadTabs(story);
    wireTimelineToggle();

    var readMoreBtn = document.getElementById("btnReadMore");
    if (readMoreBtn) {
      readMoreBtn.onclick = function () {
        var box = document.getElementById("readMoreBox");
        var open = box.classList.toggle("open");
        readMoreBtn.textContent = open ? t("readLess") : t("readMore");
      };
    }
    var theoryMoreBtn = document.getElementById("btnTheoryMore");
    if (theoryMoreBtn) {
      theoryMoreBtn.onclick = function () {
        var box = document.getElementById("theoryReadMoreBox");
        var open = box.classList.toggle("open");
        theoryMoreBtn.textContent = open ? t("readLess") : t("readMore");
      };
    }

    document.querySelectorAll("[data-entity-open]").forEach(function (chip) {
      chip.onclick = function () {
        var ent = findEntity(story, chip.getAttribute("data-entity-open"));
        if (ent) openEntityModal(ent, story);
      };
    });
    document.querySelectorAll(".lk").forEach(function (span) {
      span.onclick = function () {
        var ent = findEntity(story, span.getAttribute("data-entity"));
        if (ent) openEntityModal(ent, story);
      };
    });
    document.querySelectorAll("[data-open]").forEach(function (btn) {
      btn.onclick = function () {
        var url = btn.getAttribute("data-open");
        if (url) window.open(url, "_blank", "noopener,noreferrer");
      };
    });
    drawMarketChart(story);
    wireSwipe(document.getElementById("tabTrack"));
    syncTabHeight();
    observeActivePane();
    // Bilder (Entity-Avatare in Stakeholders etc.) koennen den Pane
    // nachtraeglich hoeher machen, sobald sie geladen sind -- Hoehe dann
    // nochmal neu abgleichen.
    document.querySelectorAll("#tabTrack img").forEach(function (img) {
      if (!img.complete) img.addEventListener("load", syncTabHeight, { once: true });
    });
  }

  var TAB_COUNT = 5;
  function setActiveTab(i, silent) {
    state.activeTab = i;
    document.querySelectorAll("#detailTabbar .tab-btn").forEach(function (b, idx) {
      b.classList.toggle("active", idx === i);
    });
    var track = document.getElementById("tabTrack");
    if (track) track.style.transform = "translateX(-" + (i * (100 / TAB_COUNT)) + "%)";
    syncTabHeight();
    observeActivePane();
  }

  /* Der Tab-Carousel (.tab-viewport > .tab-track > 5x .tab-pane) legt alle
     5 Tabs nebeneinander (display:flex) und verschiebt per translateX --
     OHNE das hier wuerde .tab-viewport per Flexbox-Zeilenhoehe automatisch
     so hoch wie der HOECHSTE der 5 Panes (meist "Historien" mit langen
     Zeitleisten), auch wenn z.B. "Uebersicht" viel kuerzer ist. Das war die
     grosse Luecke zwischen Uebersicht-Inhalt und der Zitate-Sektion danach
     (Nutzer-Feedback 24.08.2026). Fix: Hoehe des Viewports explizit auf die
     Hoehe des GERADE aktiven Panes setzen, mit CSS-Transition fuers
     Umschalten (s. .tab-viewport in index.template.html). */
  function syncTabHeight() {
    var track = document.getElementById("tabTrack");
    if (!track) return;
    var active = track.children[state.activeTab];
    var viewport = track.parentElement;
    if (active && viewport) viewport.style.height = active.scrollHeight + "px";
  }

  /* syncTabHeight() allein reicht nicht: es wird nur bei Tab-WECHSEL und
     nach Bild-Load aufgerufen, aber NICHT wenn sich der Inhalt INNERHALB
     des gerade offenen Panes aendert -- genau das passiert bei "Weiterlesen"
     (readMoreBtn/theoryMoreBtn togglen eine .readmore-box), beim Wechseln
     zwischen Zeitlinien-Threads (wireThreadTabs ersetzt pane.innerHTML) und
     beim Aufklappen einzelner Zeitleisten-Eintraege (wireTimelineToggle
     togglet .tl-item.expanded). Der Viewport blieb dann auf der alten, zu
     kleinen Hoehe stehen und schnitt den neu sichtbaren Text ab -- das war
     sowohl der nicht-funktionierende "Weiterlesen"-Button als auch die
     Luecken/abgeschnittene Formatierung auf Mobile als auch die Zitate, die
     nicht direkt am ausgeklappten Inhalt klebten (Nutzer-Feedback
     27.08.2026). Fix: ein ResizeObserver auf dem GERADE AKTIVEN Pane-Element
     selbst -- der feuert automatisch bei JEDER Groessenaenderung dieses
     Elements, egal wodurch ausgeloest (Klassen-Toggle, innerHTML-Ersatz,
     Bild-Load etc.), ohne dass jede einzelne Stelle im Code einzeln
     `syncTabHeight()` aufrufen muesste. */
  var tabResizeObserver = (typeof ResizeObserver !== "undefined")
    ? new ResizeObserver(function () { syncTabHeight(); })
    : null;
  function observeActivePane() {
    if (!tabResizeObserver) return;
    tabResizeObserver.disconnect();
    var track = document.getElementById("tabTrack");
    if (!track) return;
    var active = track.children[state.activeTab];
    if (active) tabResizeObserver.observe(active);
  }

  function wireSwipe(track) {
    if (!track) return;
    var startX = null;
    track.parentElement.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
    track.parentElement.addEventListener("touchend", function (e) {
      if (startX == null) return;
      var dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 40) {
        var next = state.activeTab + (dx < 0 ? 1 : -1);
        next = Math.max(0, Math.min(TAB_COUNT - 1, next));
        setActiveTab(next);
      }
      startX = null;
    }, { passive: true });
  }

  function wireThreadTabs(story) {
    document.querySelectorAll(".thread-tab").forEach(function (btn) {
      btn.onclick = function () {
        state.activeThread[story.id] = parseInt(btn.getAttribute("data-thread"), 10);
        var pane = document.querySelectorAll(".tab-pane")[0];
        pane.innerHTML = threadsHtml(story);
        wireThreadTabs(story);
        wireTimelineToggle();
      };
    });
  }
  function wireTimelineToggle() {
    document.querySelectorAll(".tl-item").forEach(function (item) {
      item.querySelector(".tl-one").onclick = function () { item.classList.toggle("expanded"); };
    });
  }

  /* ---------------- entity modal ---------------- */
  function openEntityModal(ent, story) {
    var cat = story.theme_category;
    var heroUrl = ent.context_image_url || ent.image_url;
    var hero = mediaTag(heroUrl, { iconType: ent.type, catKey: cat, cls: "entity-modal-hero", alt: ent.name });
    var isKey = (ent.profile || "").length > 300;
    var html = '<div style="--cat-color: var(--cat-' + cat + ')">' +
      '<div style="position:relative">' + hero +
        '<button class="icon-btn entity-modal-close" id="btnEntityClose" style="background:rgba(0,0,0,.4);color:#fff;border-color:transparent">' + CLOSE_ICON + '</button>' +
      '</div>' +
      '<div class="entity-modal-body">' +
        '<div class="entity-modal-type">' + escapeHtml(typeLabel(ent.type)) + (isKey ? ' · ' + t("keyFigure") : '') + '</div>' +
        '<h2 class="entity-modal-name">' + escapeHtml(ent.name) + '</h2>' +
        (ent.role_in_story ? '<p class="entity-modal-role">' + escapeHtml(ent.role_in_story) + '</p>' : '') +
        '<p class="entity-modal-bio">' + escapeHtml(ent.profile || "") + '</p>' +
        (ent.wikipedia_url ? '<button class="pill-btn" id="btnEntityWiki">' + t("wikipedia") + EXTERNAL + '</button>' : '') +
      '</div></div>';
    document.getElementById("entityModal").innerHTML = html;
    document.getElementById("entityModal").classList.add("open");
    document.getElementById("entityScrim").classList.add("open");
    document.getElementById("btnEntityClose").onclick = closeEntityModal;
    document.getElementById("entityScrim").onclick = closeEntityModal;
    var wikiBtn = document.getElementById("btnEntityWiki");
    if (wikiBtn) wikiBtn.onclick = function () { window.open(ent.wikipedia_url, "_blank", "noopener,noreferrer"); };
  }
  function closeEntityModal() {
    document.getElementById("entityModal").classList.remove("open");
    document.getElementById("entityScrim").classList.remove("open");
  }

  /* ---------------- market chart (dataviz: single hue, index=100, crosshair+tooltip) ---------------- */
  function drawMarketChart(story) {
    var mc = story.market_correlation;
    var svg = document.getElementById("mcChart");
    if (!svg || !mc || !mc.series || !mc.series.length) return;
    var allSeries = mc.series;
    var maxLen = Math.max.apply(null, allSeries.map(function (s) { return (s.points || []).length; }));
    if (!maxLen) return;
    var W = 640, H = 240, padL = 40, padR = 10, padT = 16, padB = 28;
    var allVals = [];
    allSeries.forEach(function (s) { (s.points || []).forEach(function (p) { allVals.push(p.value); }); });
    var yMin = Math.min.apply(null, allVals), yMax = Math.max.apply(null, allVals);
    var pad = (yMax - yMin) * 0.15 || 2;
    yMin -= pad; yMax += pad;
    function X(i, n) { return padL + (i / (n - 1 || 1)) * (W - padL - padR); }
    function Y(v) { return padT + (1 - (v - yMin) / (yMax - yMin || 1)) * (H - padT - padB); }
    var accent = getComputedStyle(document.documentElement).getPropertyValue("--cat-" + story.theme_category).trim() || "#0a84ff";
    var muted = getComputedStyle(document.documentElement).getPropertyValue("--ink-muted").trim() || "#7b7b83";

    var gridLines = "";
    for (var g = 0; g <= 2; g++) {
      var yy = padT + (g / 2) * (H - padT - padB);
      gridLines += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W-padR) + '" y2="' + yy + '" stroke="var(--border)" stroke-width="1"/>';
      var val = yMax - (g / 2) * (yMax - yMin);
      gridLines += '<text x="4" y="' + (yy+4) + '" font-size="11" fill="var(--ink-muted)">' + val.toFixed(0) + '</text>';
    }
    var baseline = (yMin < 100 && yMax > 100) ? '<line x1="'+padL+'" y1="'+Y(100).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Y(100).toFixed(1)+'" stroke="var(--ink-muted)" stroke-dasharray="3 3" stroke-width="1"/>' : "";

    var body = gridLines + baseline;
    var allDots = [];
    allSeries.forEach(function (series, si) {
      var pts = series.points || [];
      if (!pts.length) return;
      var color = si === 0 ? accent : muted;
      var dash = si === 0 ? "" : ' stroke-dasharray="5 4"';
      var path = pts.map(function (p, i) { return (i === 0 ? "M" : "L") + X(i, pts.length).toFixed(1) + "," + Y(p.value).toFixed(1); }).join(" ");
      body += '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5"' + dash + '/>';
      pts.forEach(function (p, i) {
        allDots.push({ x: X(i, pts.length), y: Y(p.value), color: color, date: p.date, label: series.label, value: p.value });
      });
    });
    body += allDots.map(function (d, idx) {
      return '<circle cx="' + d.x.toFixed(1) + '" cy="' + d.y.toFixed(1) + '" r="3.5" fill="var(--bg-elevated)" stroke="' + d.color + '" stroke-width="2" data-idx="' + idx + '"/>';
    }).join("");
    svg.innerHTML = body;

    var tooltip = document.getElementById("mcTooltip");
    svg.querySelectorAll("circle").forEach(function (c) {
      c.style.cursor = "pointer";
      c.addEventListener("mouseenter", function () {
        var d = allDots[parseInt(c.getAttribute("data-idx"), 10)];
        tooltip.textContent = (d.date || "") + " · " + (d.label || "") + ": " + d.value.toFixed(1);
        var rect = svg.getBoundingClientRect();
        var cx = (d.x / W) * rect.width;
        var cy = (d.y / H) * rect.height;
        tooltip.style.left = cx + "px";
        tooltip.style.top = (cy - 40) + "px";
        tooltip.classList.add("show");
      });
      c.addEventListener("mouseleave", function () { tooltip.classList.remove("show"); });
    });
  }

  /* ---------------- profile panel ---------------- */
  function renderProfilePanel() {
    var panel = document.getElementById("profilePanel");
    var html = '<div class="profile-head"><div class="profile-avatar-lg">' + avatarSVG(state.avatarSeed, 48) + '</div>' +
      '<div><div class="profile-name">' + t("profile") + '</div><button class="profile-shuffle" id="btnShuffleAvatar">' + t("newAvatar") + '</button></div></div>' +
      '<div class="profile-section"><div class="profile-label">' + t("language") + '</div>' +
      '<div class="seg-control"><button class="seg-btn' + (state.lang==="de"?" active":"") + '" data-lang="de">Deutsch</button>' +
      '<button class="seg-btn' + (state.lang==="en"?" active":"") + '" data-lang="en">English</button></div>' +
      (state.lang === "en" ? '<div style="font-size:11.5px;color:var(--ink-muted);margin-top:8px;">' + t("langNote") + '</div>' : '') + '</div>' +
      /* Kein Hell-Modus-Umschalter mehr (Nutzer-Feedback 24.08.2026:
         "verbiete den light mode") -- state.theme bleibt fest "dark", s.
         state-Init oben und init(). */
      '<div class="profile-section"><div class="profile-label">' + t("contentPrefs") + '</div>' +
      Object.keys(CATEGORIES).map(function (key) {
        return '<label class="check-row"><input type="checkbox" data-catcheck="' + key + '"' + (state.activeCats.has(key) ? " checked" : "") + '>' + escapeHtml(catLabel(key)) + '</label>';
      }).join("") + '</div>' +
      '<div class="profile-section">' +
        '<button class="menu-link" id="btnGoHistory"><span>' + t("history") + ' (' + state.history.length + ')</span><span class="chev">›</span></button>' +
        '<button class="menu-link" id="btnGoSaved"><span>' + t("saved") + ' (' + state.saved.size + ')</span><span class="chev">›</span></button>' +
      '</div>' +
      '<div class="session-note">' + t("sessionNote") + '</div>';
    panel.innerHTML = html;

    document.getElementById("btnShuffleAvatar").onclick = function () { state.avatarSeed = Math.random(); updateAvatarButtons(); renderProfilePanel(); };
    panel.querySelectorAll("[data-lang]").forEach(function (b) { b.onclick = function () { state.lang = b.getAttribute("data-lang"); fullRerender(); }; });
    panel.querySelectorAll("[data-catcheck]").forEach(function (cb) {
      cb.onchange = function () {
        var key = cb.getAttribute("data-catcheck");
        if (cb.checked) {
          state.activeCats.add(key);
        } else if (state.activeCats.size > 1) {
          state.activeCats.delete(key);
        } else {
          cb.checked = true; // mindestens eine Kategorie muss aktiv bleiben
        }
        if (state.view === "home") renderHome();
      };
    });
    document.getElementById("btnGoHistory").onclick = function () { closeProfile(); openList("history"); };
    document.getElementById("btnGoSaved").onclick = function () { closeProfile(); openList("saved"); };
  }

  function updateAvatarButtons() {
    document.getElementById("btnProfile").innerHTML = avatarSVG(state.avatarSeed, 36);
  }

  /* Kein setTheme()/Hell-Modus mehr -- data-theme wird nur noch einmal in
     init() fest auf "dark" gesetzt, s. Kommentar in renderProfilePanel(). */

  var profileOpen = false;
  function toggleProfile() {
    profileOpen = !profileOpen;
    document.getElementById("profilePanel").classList.toggle("open", profileOpen);
    document.getElementById("profileScrim").classList.toggle("open", profileOpen);
    if (profileOpen) renderProfilePanel();
  }
  function closeProfile() {
    profileOpen = false;
    document.getElementById("profilePanel").classList.remove("open");
    document.getElementById("profileScrim").classList.remove("open");
  }

  /* ---------------- history / saved list views ---------------- */
  function openList(kind) {
    state.view = kind;
    document.getElementById("homeView").style.display = "none";
    document.getElementById("listView").style.display = "";
    document.getElementById("listTitle").textContent = kind === "history" ? t("history") : t("saved");
    var ids = kind === "history" ? state.history : Array.from(state.saved);
    var body = document.getElementById("listBody");
    if (!ids.length) {
      body.innerHTML = '<div class="empty-state">' + (kind === "history" ? t("emptyHistory") : t("emptySaved")) + "</div>";
      return;
    }
    body.innerHTML = ids.map(function (id) {
      var s = getStory(id);
      if (!s) return "";
      var thumb = mediaTag(s.image_url, { iconType: "event", catKey: s.theme_category, cls: "list-thumb", alt: s.title });
      return '<div class="list-row" data-id="' + id + '">' + thumb +
        '<div><div class="card-title-sm">' + escapeHtml(s.title) + '</div><div class="list-meta">' + escapeHtml(catLabel(s.theme_category)) + '</div></div></div>';
    }).join("");
    body.querySelectorAll(".list-row").forEach(function (row) {
      row.onclick = function () { openDetail(row.getAttribute("data-id")); };
    });
  }
  function goHome() {
    state.view = "home";
    document.getElementById("homeView").style.display = "";
    document.getElementById("listView").style.display = "none";
    closeDetail();
  }

  function fullRerender() {
    updateAvatarButtons();
    renderLastUpdated();
    if (state.view === "home") renderHome();
    else if (state.view === "history" || state.view === "saved") openList(state.view);
    if (document.getElementById("profilePanel").classList.contains("open")) renderProfilePanel();
  }

  /* ---------------- init ---------------- */
  function renderLastUpdated() {
    var el = document.getElementById("lastUpdated");
    if (!el) return;
    var iso = window.__BUILD_DATE__;
    var label = iso;
    try {
      var d = new Date(iso + "T00:00:00");
      if (!isNaN(d.getTime())) {
        label = d.toLocaleDateString(state.lang === "de" ? "de-DE" : "en-US", { day: "numeric", month: "long", year: "numeric" });
      }
    } catch (e) {}
    el.textContent = t("standLabel")(label);
  }

  function init() {
    document.documentElement.setAttribute("data-theme", state.theme);
    updateAvatarButtons();
    document.getElementById("btnProfile").onclick = toggleProfile;
    document.getElementById("profileScrim").onclick = closeProfile;
    document.getElementById("btnHome").onclick = goHome;
    document.getElementById("entityScrim").onclick = closeEntityModal;
    renderLastUpdated();
    renderHome();
    window.addEventListener("resize", syncTabHeight);
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
